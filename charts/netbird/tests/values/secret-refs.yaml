dashboard:
  config:
    auth:
      clientSecretRef:
        name: netbird-external-credentials
        key: dashboard-client-secret

backend:
  split:
    management:
      config:
        stuns:
          - proto: udp
            uri: stun:stun.example.com:3478
            username: stun-user
            passwordRef:
              name: netbird-external-credentials
              key: stun-password
        turnConfig:
          turns:
            - proto: udp
              uri: turn:turn.example.com:3478
              username: turn-user
              passwordRef:
                name: netbird-external-credentials
                key: turn-password
          secretRef:
            name: netbird-external-credentials
            key: turn-secret
        signal:
          passwordRef:
            name: netbird-external-credentials
            key: signal-password
        dataStoreEncryptionKeyRef:
          name: netbird-external-credentials
          key: datastore-encryption-key
        embeddedIdp:
          storage:
            config:
              dsnRef:
                name: netbird-external-credentials
                key: idp-storage-dsn
          sessionCookieEncryptionKeyRef:
            name: netbird-external-credentials
            key: idp-session-cookie-encryption-key
          owner:
            email: admin@example.com
            passwordRef:
              name: netbird-external-credentials
              key: owner-password-hash
    relay:
      config:
        authSecretRef:
          name: netbird-external-credentials
          key: relay-auth-secret
