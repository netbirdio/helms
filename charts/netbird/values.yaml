global:
  namespace: ""
  # Registry prefix for every image, e.g. registry.example.com.
  imageRegistry: ""
  compatibility:
    openshift:
      # Drop runAsUser, runAsGroup and fsGroup from pod security contexts, so
      # OpenShift's restricted-v2 SCC assigns them from the namespace range.
      # auto detects OpenShift (needs a cluster, so helm template never does),
      # force always drops them, disabled never does.
      adaptSecurityContext: auto

nameOverride: ""
fullnameOverride: ""

# The dashboard is always deployed. It is stateless and can be scaled independently.
dashboard:
  enabled: true
  # Overrides global.namespace for this component.
  namespace: ""
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    # The rootless variant listens on 8080 as a non-root user.
    tag: v2.96.0-rootless
    # Pins the image by digest (sha256:...) and ignores tag when set.
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  deployment:
    annotations: {}

  pod:
    annotations: {}
    # Restricted Pod Security Standard. The rootless image runs as 10001:0.
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  container:
    port: 8080
    cmd:
      command: []
      args: []
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  env: {}
  envRaw: []
  envFromSecret: {}
  lifecycle: {}

  config:
    api:
      httpEndpoint: ""
      grpcEndpoint: ""
    auth:
      audience: netbird-dashboard
      clientId: netbird-dashboard
      clientSecret: ""
      # References a key in a Secret in this component's namespace. Mutually exclusive with clientSecret.
      clientSecretRef: {}
      authority: ""
      useAuth0: false
      supportedScopes: "openid profile email groups"
      # Empty follows the IdP: /nb-auth and /nb-silent-auth with the embedded IdP,
      # the dashboard defaults (/#callback, /#silent-callback) otherwise.
      redirectUri: ""
      silentRedirectUri: ""
      tokenSource: accessToken

  livenessProbe:
    periodSeconds: 5
    httpGet:
      path: /
      port: http

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    httpGet:
      path: /
      port: http

  volumeMounts: []
  volumes: []

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    externalIPs: []

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: dashboard.netbird.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

backend:
  split:
    management:
      enabled: true
      # Overrides global.namespace for this component.
      namespace: ""
      replicaCount: 1

      image:
        repository: netbirdio/management
        tag: 0.77.0
        # Pins the image by digest (sha256:...) and ignores tag when set.
        digest: ""
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        # Restricted Pod Security Standard. On OpenShift, runAsUser, runAsGroup and
        # fsGroup are dropped (see global.compatibility.openshift).
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault

      container:
        port: 8080
        cmd:
          command: []
          # Extra arguments, appended after the flags from server.
          args: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

      # Management server flags.
      server:
        # Management runs in single-account mode by default: every user joins
        # one account with this domain. Set "" to turn the mode off.
        singleAccountModeDomain: netbird.selfhosted
        dnsDomain: netbird.selfhosted
        disableLegacyPort: true

      # Deployment strategy. Empty uses Recreate when persistence is enabled,
      # because a ReadWriteOnce volume cannot attach to two pods.
      strategy: {}

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      metrics:
        enabled: false
        port: 9090

      log:
        level: info
        file: console

      livenessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        tcpSocket:
          port: http

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: http

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 80
        # gRPC through Gateway API needs HTTP/2 cleartext. Set "" to omit.
        appProtocol: kubernetes.io/h2c
        annotations: {}
        externalIPs: []

      persistence:
        enabled: true
        mountPath: /var/lib/netbird
        accessModes:
          - ReadWriteOnce
        size: 1Gi
        storageClass: ""
        existingClaim: ""
        annotations: {}

      # Management still uses its established JSON schema. The chart serializes
      # this object and expands secret fields at process start.
      config:
        # Each entry may set passwordRef instead of password.
        stuns: []
        turnConfig:
          # Each entry may set passwordRef instead of password.
          turns: []
          credentialsTTL: 12h
          secret: ""
          # References a key in a Secret in this component's namespace. Mutually exclusive with secret.
          secretRef: {}
          timeBasedCredentials: false
        relay:
          addresses:
            - rels://netbird.example.com:443/relay
          credentialsTTL: 24h
          # Authentication is shared with backend.split.relay.config.authSecret.
        signal:
          proto: https
          uri: netbird.example.com:443
          username: ""
          password: null
          # References a key in a Secret in this component's namespace. Mutually exclusive with password.
          passwordRef: {}
        reverseProxy:
          trustedHTTPProxies: []
          trustedHTTPProxiesCount: 0
          trustedPeers: []
          accessLogRetentionDays: 0
          accessLogCleanupIntervalHours: 0
        datadir: /var/lib/netbird
        # Required: base64-encoded 32-byte AES key (openssl rand -base64 32), or set dataStoreEncryptionKeyRef.
        dataStoreEncryptionKey: ""
        # References a key in a Secret in this component's namespace. Mutually exclusive with dataStoreEncryptionKey.
        dataStoreEncryptionKeyRef: {}
        storeConfig:
          # sqlite, postgres or mysql.
          engine: sqlite
          # Required for postgres and mysql. Mutually exclusive with dsnRef.
          dsn: ""
          # References a key in a Secret in this component's namespace.
          dsnRef: {}
        idpManagerConfig:
          managerType: none
        embeddedIdp:
          enabled: true
          issuer: https://netbird.example.com/oauth2
          storage:
            type: sqlite3
            config:
              file: /var/lib/netbird/idp.db
              dsn: ""
              # References a key in a Secret in this component's namespace. Mutually exclusive with dsn.
              dsnRef: {}
          localAuthDisabled: false
          signKeyRefreshEnabled: true
          mfaSessionMaxLifetime: ""
          mfaSessionIdleTimeout: ""
          mfaSessionRememberMe: false
          # Required when enabled: set this value or sessionCookieEncryptionKeyRef.
          sessionCookieEncryptionKey: ""
          # References a key in a Secret in this component's namespace. Mutually exclusive with sessionCookieEncryptionKey.
          sessionCookieEncryptionKeyRef: {}
          dashboardRedirectURIs:
            - https://dashboard.netbird.example.com/nb-auth
            - https://dashboard.netbird.example.com/nb-silent-auth
          cliRedirectURIs:
            - http://localhost:53000/
            - http://localhost:54000/
          dashboardPostLogoutRedirectURIs:
            - https://dashboard.netbird.example.com/
          grantTypes: []
          owner:
            email: ""
            password: ""
            # The referenced value must be a bcrypt hash. Mutually exclusive with password.
            passwordRef: {}
            username: ""
        agentNetwork:
          # Effective on NetBird 0.77.0+; ignored by 0.74.0.
          pricingDefaultsFile: ""

      overrideConfig: ""

      ingress:
        http:
          enabled: false
          className: ""
          annotations: {}
          hosts:
            - host: netbird.example.com
              paths:
                - path: /api
                  pathType: ImplementationSpecific
                - path: /oauth2
                  pathType: ImplementationSpecific
          tls: []
        grpc:
          enabled: false
          className: ""
          annotations: {}
          hosts:
            - host: netbird.example.com
              paths:
                - path: /management.ManagementService
                  pathType: ImplementationSpecific
                - path: /management.ProxyService
                  pathType: ImplementationSpecific
          tls: []

    signal:
      enabled: true
      # Overrides global.namespace for this component.
      namespace: ""
      replicaCount: 1

      image:
        repository: netbirdio/signal
        tag: 0.77.0
        # Pins the image by digest (sha256:...) and ignores tag when set.
        digest: ""
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        # Restricted Pod Security Standard. On OpenShift, runAsUser, runAsGroup and
        # fsGroup are dropped (see global.compatibility.openshift).
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault

      container:
        port: 10000
        cmd:
          command: []
          args: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      metrics:
        enabled: false
        port: 9090

      config:
        letsencryptDomain: ""
        letsencryptEmail: ""
        letsencryptDataDir: ""
        certFile: ""
        certKey: ""
        logLevel: info
        logFile: console
        # Effective on NetBird 0.77.0+; ignored by 0.74.0.
        pprofAddress: ""


      livenessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: grpc

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: grpc

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 80
        # gRPC through Gateway API needs HTTP/2 cleartext. Set "" to omit.
        appProtocol: kubernetes.io/h2c
        annotations: {}
        externalIPs: []

      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts:
          - host: netbird.example.com
            paths:
              - path: /signalexchange.SignalExchange
                pathType: ImplementationSpecific
        tls: []

    relay:
      enabled: true
      # Overrides global.namespace for this component.
      namespace: ""
      replicaCount: 1

      image:
        repository: netbirdio/relay
        tag: 0.77.0
        # Pins the image by digest (sha256:...) and ignores tag when set.
        digest: ""
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        # Restricted Pod Security Standard. On OpenShift, runAsUser, runAsGroup and
        # fsGroup are dropped (see global.compatibility.openshift).
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault

      container:
        port: 33080
        cmd:
          command: []
          args: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      config:
        exposedAddress: rels://netbird.example.com:443/relay
        # Required: set this value or authSecretRef.
        authSecret: ""
        # References a key in a Secret in this component's namespace. Mutually exclusive with authSecret.
        authSecretRef: {}
        log:
          level: info
          file: console
        metrics:
          enabled: false
          port: 9090
        health:
          enabled: true
          port: 9000
        # Effective on NetBird 0.77.0+; ignored by 0.74.0.
        trustedProxies: ""
        letsencrypt:
          email: ""
          dataDir: ""
          domains: []
          awsRoute53: false
        tls:
          certFile: ""
          keyFile: ""
        stun:
          enabled: false
          ports:
            - 3478
          logLevel: info


      livenessProbe:
        initialDelaySeconds: 5
        periodSeconds: 10
        tcpSocket:
          port: http

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: http

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 33080
        annotations: {}
        externalIPs: []

      stunService:
        enabled: false
        type: LoadBalancer
        annotations: {}
        externalIPs: []
        loadBalancerIP: ""
        externalTrafficPolicy: Cluster
        # Fixed node ports for type NodePort, by STUN port, e.g. {"3478": 30478}.
        nodePorts: {}

      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts:
          - host: netbird.example.com
            paths:
              - path: /relay
                pathType: ImplementationSpecific
        tls: []

extraManifests: []

metrics:
  serviceMonitor:
    enabled: false
    namespace: ""
    annotations: {}
    labels: {}
    jobLabel: ""
    honorLabels: false
    interval: ""
    scrapeTimeout: ""
    metricRelabelings: []
    relabelings: []
    selector: {}
