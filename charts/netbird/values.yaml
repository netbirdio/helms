global:
  namespace: ""

nameOverride: ""
fullnameOverride: ""

# The dashboard is always deployed. It is stateless and can be scaled independently.
dashboard:
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    tag: v2.91.1
    pullPolicy: IfNotPresent
    pullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  deployment:
    annotations: {}

  pod:
    annotations: {}
    securityContext: {}

  container:
    port: 80
    cmd:
      command: []
      args: []
    securityContext: {}

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  env: {}
  envRaw: []
  envFromSecret: {}
  lifecycle: {}

  config:
    api:
      httpEndpoint: ""
      grpcEndpoint: ""
    auth:
      audience: netbird-dashboard
      clientId: netbird-dashboard
      clientSecret: ""
      authority: ""
      useAuth0: false
      supportedScopes: "openid profile email groups"
      redirectUri: /nb-auth
      silentRedirectUri: /nb-silent-auth
      tokenSource: accessToken

  livenessProbe:
    periodSeconds: 5
    httpGet:
      path: /
      port: http

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    httpGet:
      path: /
      port: http

  volumeMounts: []
  volumes: []

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    externalIPs: []

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: dashboard.netbird.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

backend:
  split:
    management:
      replicaCount: 1

      image:
        repository: netbirdio/management
        tag: 0.77.0
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        securityContext: {}

      container:
        port: 80
        cmd:
          command: []
          args:
            - --disable-legacy-port=true
            - --single-account-mode-domain=netbird.selfhosted
            - --dns-domain=netbird.selfhosted
        securityContext: {}

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      metrics:
        enabled: false
        port: 9090

      log:
        level: info
        file: console

      livenessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        tcpSocket:
          port: http

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: http

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 80
        annotations: {}
        externalIPs: []

      persistence:
        enabled: true
        mountPath: /var/lib/netbird
        accessModes:
          - ReadWriteOnce
        size: 1Gi
        storageClass: ""
        existingClaim: ""
        annotations: {}

      # Management still uses its established JSON schema. The chart serializes
      # this object and expands secret fields at process start.
      config:
        stuns: []
        turnConfig:
          turns: []
          credentialsTTL: 12h
          secret: ""
          timeBasedCredentials: false
        relay:
          addresses:
            - rels://netbird.example.com:443/relay
          credentialsTTL: 24h
          secret: ""
        signal:
          proto: https
          uri: netbird.example.com:443
          username: ""
          password: null
        reverseProxy:
          trustedHTTPProxies: []
          trustedHTTPProxiesCount: 0
          trustedPeers: []
          accessLogRetentionDays: 0
          accessLogCleanupIntervalHours: 0
        datadir: /var/lib/netbird
        # Base64-encoded 32-byte AES key. Generated when empty.
        dataStoreEncryptionKey: ""
        storeConfig:
          engine: sqlite
        idpManagerConfig:
          managerType: none
        embeddedIdp:
          enabled: true
          issuer: https://netbird.example.com/oauth2
          storage:
            type: sqlite3
            config:
              file: /var/lib/netbird/idp.db
              dsn: ""
          localAuthDisabled: false
          signKeyRefreshEnabled: true
          mfaSessionMaxLifetime: ""
          mfaSessionIdleTimeout: ""
          mfaSessionRememberMe: false
          sessionCookieEncryptionKey: ""
          dashboardRedirectURIs:
            - https://dashboard.netbird.example.com/nb-auth
            - https://dashboard.netbird.example.com/nb-silent-auth
          cliRedirectURIs:
            - http://localhost:53000/
            - http://localhost:54000/
          dashboardPostLogoutRedirectURIs:
            - https://dashboard.netbird.example.com/
          grantTypes: []
          owner:
            email: ""
            password: ""
            username: ""
        agentNetwork:
          # Effective on NetBird 0.77.0+; ignored by 0.74.0.
          pricingDefaultsFile: ""

      overrideConfig: ""

      ingress:
        http:
          enabled: false
          className: ""
          annotations: {}
          hosts:
            - host: netbird.example.com
              paths:
                - path: /api
                  pathType: ImplementationSpecific
                - path: /oauth2
                  pathType: ImplementationSpecific
          tls: []
        grpc:
          enabled: false
          className: ""
          annotations: {}
          hosts:
            - host: netbird.example.com
              paths:
                - path: /management.ManagementService
                  pathType: ImplementationSpecific
                - path: /management.ProxyService
                  pathType: ImplementationSpecific
          tls: []

    signal:
      replicaCount: 1

      image:
        repository: netbirdio/signal
        tag: 0.77.0
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        securityContext: {}

      container:
        port: 80
        cmd:
          command: []
          args: []
        securityContext: {}

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      metrics:
        enabled: false
        port: 9090

      config:
        letsencryptDomain: ""
        letsencryptEmail: ""
        letsencryptDataDir: ""
        certFile: ""
        certKey: ""
        logLevel: info
        logFile: console
        # Effective on NetBird 0.77.0+; ignored by 0.74.0.
        pprofAddress: ""


      livenessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: grpc

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: grpc

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 80
        annotations: {}
        externalIPs: []

      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts:
          - host: netbird.example.com
            paths:
              - path: /signalexchange.SignalExchange
                pathType: ImplementationSpecific
        tls: []

    relay:
      replicaCount: 1

      image:
        repository: netbirdio/relay
        tag: 0.77.0
        pullPolicy: IfNotPresent
        pullSecrets: []

      serviceAccount:
        create: true
        annotations: {}
        name: ""

      deployment:
        annotations: {}

      pod:
        annotations: {}
        securityContext: {}

      container:
        port: 33080
        cmd:
          command: []
          args: []
        securityContext: {}

      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

      env: {}
      envRaw: []
      envFromSecret: {}
      lifecycle: {}

      config:
        exposedAddress: rels://netbird.example.com:443/relay
        authSecret: ""
        log:
          level: info
          file: console
        metrics:
          enabled: false
          port: 9090
        health:
          enabled: true
          port: 9000
        # Effective on NetBird 0.77.0+; ignored by 0.74.0.
        trustedProxies: ""
        letsencrypt:
          email: ""
          dataDir: ""
          domains: []
          awsRoute53: false
        tls:
          certFile: ""
          keyFile: ""
        stun:
          enabled: false
          ports:
            - 3478
          logLevel: info


      livenessProbe:
        initialDelaySeconds: 5
        periodSeconds: 10
        tcpSocket:
          port: http

      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: http

      volumeMounts: []
      volumes: []

      service:
        type: ClusterIP
        port: 33080
        annotations: {}
        externalIPs: []

      stunService:
        enabled: false
        type: LoadBalancer
        annotations: {}
        externalIPs: []
        loadBalancerIP: ""
        externalTrafficPolicy: Cluster

      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts:
          - host: netbird.example.com
            paths:
              - path: /relay
                pathType: ImplementationSpecific
        tls: []

extraManifests: []

metrics:
  serviceMonitor:
    enabled: false
    namespace: ""
    annotations: {}
    labels: {}
    jobLabel: ""
    honorLabels: false
    interval: ""
    scrapeTimeout: ""
    metricRelabelings: []
    relabelings: []
    selector: {}
