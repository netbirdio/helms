{{- if .Values.backend.split.signal.enabled }}
{{- if .Values.backend.split.signal.serviceAccount.create }}
{{- $values := .Values.backend.split.signal -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "netbird.serviceAccountName" (dict "root" . "component" "signal" "values" $values) }}
  namespace: {{ include "netbird.componentNamespace" (dict "root" . "component" "signal") }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "signal") | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
