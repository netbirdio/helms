{{- if not .Values.backend.split.management.overrideConfig }}
{{- $values := .Values.backend.split.management -}}
{{- $name := printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "management")) -}}
{{- $owner := $values.config.embeddedIdp.owner -}}
{{- $dataStoreEncryptionKeyRef := default dict $values.config.dataStoreEncryptionKeyRef -}}
{{- $sessionCookieEncryptionKeyRef := default dict $values.config.embeddedIdp.sessionCookieEncryptionKeyRef -}}
{{- $usesInlineOwnerPassword := and $owner.email $owner.password -}}
{{- if or (not $dataStoreEncryptionKeyRef) (not $sessionCookieEncryptionKeyRef) $usesInlineOwnerPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "management") | nindent 4 }}
type: Opaque
stringData:
  {{- if not $dataStoreEncryptionKeyRef }}
  datastore-encryption-key: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "datastore-encryption-key" "value" $values.config.dataStoreEncryptionKey "length" 32 "base64" true) | quote }}
  {{- end }}
  {{- if not $sessionCookieEncryptionKeyRef }}
  idp-session-cookie-encryption-key: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "idp-session-cookie-encryption-key" "value" $values.config.embeddedIdp.sessionCookieEncryptionKey "length" 32) | quote }}
  {{- end }}
  {{- if $usesInlineOwnerPassword }}
  owner-password-checksum: {{ sha256sum $owner.password | quote }}
  owner-password-hash: {{ include "netbird.passwordHash" (dict "root" . "name" $name "hashKey" "owner-password-hash" "checksumKey" "owner-password-checksum" "password" $owner.password) | quote }}
  {{- end }}
{{- end }}
{{- end }}
