{{- if .Values.backend.split.management.serviceAccount.create }}
{{- $values := .Values.backend.split.management -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "netbird.serviceAccountName" (dict "root" . "component" "management" "values" $values) }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "management") | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
