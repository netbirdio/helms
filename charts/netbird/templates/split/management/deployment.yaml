{{- $values := .Values.backend.split.management -}}
{{- $name := include "netbird.componentName" (dict "root" . "component" "management") -}}
{{- $credentialsName := printf "%s-credentials" $name -}}
{{- $relayCredentialsName := printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "relay")) -}}
{{- $dataStoreEncryptionKeyRef := default dict $values.config.dataStoreEncryptionKeyRef -}}
{{- $sessionCookieEncryptionKeyRef := default dict $values.config.embeddedIdp.sessionCookieEncryptionKeyRef -}}
{{- $relayValues := .Values.backend.split.relay -}}
{{- $relayAuthSecretRef := default dict $relayValues.config.authSecretRef -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "management") | nindent 4 }}
  {{- with $values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" (dict "root" . "component" "management") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/split/management/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ dict "management" $values.config "relay" $relayValues.config | toJson | sha256sum }}
        {{- with $values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netbird.selectorLabels" (dict "root" . "component" "management") | nindent 8 }}
    spec:
      {{- with $values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "netbird.serviceAccountName" (dict "root" . "component" "management" "values" $values) }}
      securityContext:
        {{- toYaml $values.pod.securityContext | nindent 8 }}
      containers:
        - name: management
          image: "{{ $values.image.repository }}:{{ $values.image.tag }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          {{- with $values.container.cmd.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config=/etc/netbird/management.json
            - --port={{ $values.container.port }}
            - --metrics-port={{ $values.metrics.port }}
            - --log-level={{ $values.log.level }}
            - --log-file={{ $values.log.file }}
            {{- with $values.container.cmd.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $values.container.securityContext | nindent 12 }}
          {{- if or (not $values.overrideConfig) $values.env $values.envRaw $values.envFromSecret }}
          env:
            {{- if not $values.overrideConfig }}
            - name: NB_MANAGEMENT_DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if $dataStoreEncryptionKeyRef }}
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $dataStoreEncryptionKeyRef
                    "value" $values.config.dataStoreEncryptionKey
                    "path" "backend.split.management.config.dataStoreEncryptionKeyRef"
                  ) | nindent 18 }}
                  {{- else }}
                  name: {{ $credentialsName }}
                  key: datastore-encryption-key
                  {{- end }}
            - name: NB_IDP_SESSION_COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if $sessionCookieEncryptionKeyRef }}
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $sessionCookieEncryptionKeyRef
                    "value" $values.config.embeddedIdp.sessionCookieEncryptionKey
                    "path" "backend.split.management.config.embeddedIdp.sessionCookieEncryptionKeyRef"
                  ) | nindent 18 }}
                  {{- else }}
                  name: {{ $credentialsName }}
                  key: idp-session-cookie-encryption-key
                  {{- end }}
            - name: NB_RELAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $relayAuthSecretRef }}
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $relayAuthSecretRef
                    "value" $relayValues.config.authSecret
                    "path" "backend.split.relay.config.authSecretRef"
                  ) | nindent 18 }}
                  {{- else }}
                  name: {{ $relayCredentialsName }}
                  key: relay-auth-secret
                  {{- end }}
            {{- range $index, $stun := $values.config.stuns }}
            {{- $passwordRef := default dict (get $stun "passwordRef") }}
            {{- if $passwordRef }}
            - name: NB_MANAGEMENT_STUN_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $passwordRef
                    "value" (get $stun "password")
                    "path" (printf "backend.split.management.config.stuns[%d].passwordRef" $index)
                  ) | nindent 18 }}
            {{- end }}
            {{- end }}
            {{- with $values.config.turnConfig.secretRef }}
            - name: NB_MANAGEMENT_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" .
                    "value" $values.config.turnConfig.secret
                    "path" "backend.split.management.config.turnConfig.secretRef"
                  ) | nindent 18 }}
            {{- end }}
            {{- range $index, $turn := $values.config.turnConfig.turns }}
            {{- $passwordRef := default dict (get $turn "passwordRef") }}
            {{- if $passwordRef }}
            - name: NB_MANAGEMENT_TURN_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $passwordRef
                    "value" (get $turn "password")
                    "path" (printf "backend.split.management.config.turnConfig.turns[%d].passwordRef" $index)
                  ) | nindent 18 }}
            {{- end }}
            {{- end }}
            {{- with $values.config.signal.passwordRef }}
            - name: NB_MANAGEMENT_SIGNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" .
                    "value" $values.config.signal.password
                    "path" "backend.split.management.config.signal.passwordRef"
                  ) | nindent 18 }}
            {{- end }}
            {{- with $values.config.embeddedIdp.storage.config.dsnRef }}
            - name: NB_IDP_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" .
                    "value" $values.config.embeddedIdp.storage.config.dsn
                    "path" "backend.split.management.config.embeddedIdp.storage.config.dsnRef"
                  ) | nindent 18 }}
            {{- end }}
            {{- $owner := $values.config.embeddedIdp.owner }}
            {{- if and $owner.email (or $owner.password $owner.passwordRef) }}
            - name: NB_OWNER_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  {{- if $owner.passwordRef }}
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $owner.passwordRef
                    "value" $owner.password
                    "path" "backend.split.management.config.embeddedIdp.owner.passwordRef"
                  ) | nindent 18 }}
                  {{- else }}
                  name: {{ $credentialsName }}
                  key: owner-password-hash
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- include "netbird.env" (dict "values" $values) | nindent 12 }}
          {{- end }}
          {{- with $values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $values.container.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $values.metrics.port }}
              protocol: TCP
          {{- with $values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/netbird/management.json
              subPath: management.json
            {{- if $values.persistence.enabled }}
            - name: data
              mountPath: {{ $values.persistence.mountPath }}
            {{- end }}
            {{- with $values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- if $values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name $values.persistence.existingClaim }}
        {{- end }}
        {{- with $values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
