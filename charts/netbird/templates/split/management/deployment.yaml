{{- $values := .Values.backend.split.management -}}
{{- $name := include "netbird.componentName" (dict "root" . "component" "management") -}}
{{- $credentialsName := printf "%s-credentials" $name -}}
{{- $relayCredentialsName := printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "relay")) -}}
{{- $relayValues := .Values.backend.split.relay -}}
{{- $relayAuthSecretRef := default dict $relayValues.config.authSecretRef -}}
{{- $secretEnv := list -}}
{{- $reservedEnv := list -}}
{{- if not $values.overrideConfig -}}
{{- $secretEnv = include "netbird.management.secretEnv" . | fromJsonArray -}}
{{- range $secretEnv -}}{{- $reservedEnv = append $reservedEnv .env -}}{{- end -}}
{{- $reservedEnv = append $reservedEnv "NB_RELAY_AUTH_SECRET" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "management") | nindent 4 }}
  {{- with $values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $values.replicaCount }}
  {{- with (or $values.strategy (and $values.persistence.enabled (dict "type" "Recreate"))) }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" (dict "root" . "component" "management") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/split/management/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include "netbird.credentialsChecksum" (dict "root" . "data" (dict "management" $values.config "relay" $relayValues.config)) }}
        {{- with $values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netbird.selectorLabels" (dict "root" . "component" "management") | nindent 8 }}
    spec:
      {{- with $values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "netbird.serviceAccountName" (dict "root" . "component" "management" "values" $values) }}
      securityContext:
        {{- toYaml $values.pod.securityContext | nindent 8 }}
      containers:
        - name: management
          image: "{{ $values.image.repository }}:{{ $values.image.tag }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          {{- with $values.container.cmd.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config=/etc/netbird/management.json
            - --port={{ $values.container.port }}
            - --metrics-port={{ $values.metrics.port }}
            - --log-level={{ $values.log.level }}
            - --log-file={{ $values.log.file }}
            {{- if $values.server.singleAccountModeDomain }}
            - --single-account-mode-domain={{ $values.server.singleAccountModeDomain }}
            {{- else }}
            - --disable-single-account-mode=true
            {{- end }}
            {{- with $values.server.dnsDomain }}
            - --dns-domain={{ . }}
            {{- end }}
            {{- if $values.server.disableLegacyPort }}
            - --disable-legacy-port=true
            {{- end }}
            {{- with $values.container.cmd.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $values.container.securityContext | nindent 12 }}
          {{- if or (not $values.overrideConfig) $values.env $values.envRaw $values.envFromSecret }}
          env:
            {{- if not $values.overrideConfig }}
            {{- range $secretEnv }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  {{- if .ref }}
                  {{- include "netbird.secretKeyRef" (dict "ref" .ref "value" .value "path" .path) | nindent 18 }}
                  {{- else }}
                  name: {{ $credentialsName }}
                  key: {{ .key }}
                  {{- end }}
            {{- end }}
            - name: NB_RELAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $relayAuthSecretRef }}
                  {{- include "netbird.secretKeyRef" (dict
                    "ref" $relayAuthSecretRef
                    "value" $relayValues.config.authSecret
                    "path" "backend.split.relay.config.authSecretRef"
                  ) | nindent 18 }}
                  {{- else }}
                  name: {{ $relayCredentialsName }}
                  key: relay-auth-secret
                  {{- end }}
            {{- end }}
            {{- include "netbird.env" (dict "values" $values "reserved" $reservedEnv) | nindent 12 }}
          {{- end }}
          {{- with $values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $values.container.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $values.metrics.port }}
              protocol: TCP
          {{- with $values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/netbird/management.json
              subPath: management.json
            {{- if $values.persistence.enabled }}
            - name: data
              mountPath: {{ $values.persistence.mountPath }}
            {{- end }}
            {{- with $values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- if $values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name $values.persistence.existingClaim }}
        {{- end }}
        {{- with $values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
