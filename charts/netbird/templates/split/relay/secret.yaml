{{- if .Values.backend.split.relay.enabled }}
{{- $values := .Values.backend.split.relay -}}
{{- include "netbird.requireSecret" (dict "value" $values.config.authSecret "ref" $values.config.authSecretRef "path" "backend.split.relay.config.authSecret" "hint" "generate one with: openssl rand -base64 32") -}}
{{- if not $values.config.authSecretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "relay")) }}
  namespace: {{ include "netbird.componentNamespace" (dict "root" . "component" "relay") }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "relay") | nindent 4 }}
type: Opaque
stringData:
  relay-auth-secret: {{ $values.config.authSecret | quote }}
{{- end }}
{{- end }}
