{{- $values := .Values.backend.split.relay -}}
{{- $name := printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "relay")) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "relay") | nindent 4 }}
type: Opaque
stringData:
  relay-auth-secret: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "relay-auth-secret" "value" $values.config.authSecret "length" 32) | quote }}
