{{- if .Values.backend.split.relay.enabled }}
{{- if .Values.backend.split.relay.ingress.enabled }}
{{- $ingress := .Values.backend.split.relay.ingress -}}
{{- $name := include "netbird.componentName" (dict "root" . "component" "relay") -}}
{{- $port := .Values.backend.split.relay.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.componentNamespace" (dict "root" . "component" "relay") }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "relay") | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if include "netbird.relay.perPod" . }}
    {{- /* One host per pod; clients always request /relay. ingress.hosts does not apply. */}}
    {{- range $pod := include "netbird.relay.podAddresses" . | fromJsonArray }}
    - host: {{ $pod.host | quote }}
      http:
        paths:
          - path: /relay
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "netbird.componentName" (dict "root" $ "component" (printf "relay-%d" (int $pod.ordinal))) }}
                port:
                  number: {{ $port }}
    {{- end }}
    {{- else }}
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
