{{- if .Values.backend.split.relay.enabled }}
{{- $values := .Values.backend.split.relay -}}
{{- if $values.service.quic.enabled }}
{{- if not (or $values.config.tls.certFile $values.config.letsencrypt.domains) }}
{{- fail "backend.split.relay.service.quic.enabled needs the relay to terminate TLS: set backend.split.relay.config.tls or backend.split.relay.config.letsencrypt.domains" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.componentName" (dict "root" . "component" "relay") }}
  namespace: {{ include "netbird.componentNamespace" (dict "root" . "component" "relay") }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "relay") | nindent 4 }}
  {{- with $values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $values.service.type }}
  ports:
    - name: http
      port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if $values.service.quic.enabled }}
    - name: quic
      port: {{ $values.service.port }}
      targetPort: quic
      protocol: UDP
    {{- end }}
    {{- if $values.config.metrics.enabled }}
    - name: metrics
      port: {{ $values.config.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if $values.config.health.enabled }}
    - name: health
      port: {{ $values.config.health.port }}
      targetPort: health
      protocol: TCP
    {{- end }}
  selector:
    {{- include "netbird.selectorLabels" (dict "root" . "component" "relay") | nindent 4 }}
  {{- with $values.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
