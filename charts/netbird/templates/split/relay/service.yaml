{{- if .Values.backend.split.relay.enabled }}
{{- $values := .Values.backend.split.relay -}}
{{- $namespace := include "netbird.componentNamespace" (dict "root" . "component" "relay") -}}
{{- if include "netbird.relay.perPod" . }}
{{- $name := include "netbird.componentName" (dict "root" . "component" "relay") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.componentName" (dict "root" . "component" "relay-headless") }}
  namespace: {{ $namespace }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "relay") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "netbird.selectorLabels" (dict "root" . "component" "relay") | nindent 4 }}
{{- range $pod := include "netbird.relay.podAddresses" . | fromJsonArray }}
---
{{- include "netbird.relay.service" (dict "root" $ "name" (include "netbird.componentName" (dict "root" $ "component" (printf "relay-%d" (int $pod.ordinal)))) "podName" (printf "%s-%d" $name (int $pod.ordinal))) }}
{{- end }}
{{- else }}
{{- include "netbird.relay.service" (dict "root" . "name" (include "netbird.componentName" (dict "root" . "component" "relay"))) }}
{{- end }}
{{- end }}
