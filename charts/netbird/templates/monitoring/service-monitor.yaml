{{- $componentMetricsEnabled := or
  .Values.backend.split.management.metrics.enabled
  .Values.backend.split.signal.metrics.enabled
  .Values.backend.split.relay.config.metrics.enabled
-}}
{{- if and .Values.metrics.serviceMonitor.enabled (not $componentMetricsEnabled) -}}
{{- fail "metrics.serviceMonitor.enabled requires metrics on management, signal, or relay" -}}
{{- end -}}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $values := .Values.metrics.serviceMonitor -}}
{{- $components := dict
  "management" .Values.backend.split.management.metrics.enabled
  "signal" .Values.backend.split.signal.metrics.enabled
  "relay" .Values.backend.split.relay.config.metrics.enabled
-}}
{{- range $component := keys $components | sortAlpha }}
{{- if get $components $component }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "netbird.componentName" (dict "root" $ "component" $component) }}
  namespace: {{ default (include "netbird.namespace" $) $values.namespace | quote }}
  labels:
    {{- include "netbird.labels" (dict "root" $ "component" $component) | nindent 4 }}
    {{- with $values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $values.jobLabel }}
  jobLabel: {{ . | quote }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
      {{- with $values.selector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "netbird.namespace" $ | quote }}
  endpoints:
    - port: metrics
      {{- with $values.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $values.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ $values.honorLabels }}
      {{- with $values.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
