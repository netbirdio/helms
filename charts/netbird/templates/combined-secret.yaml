{{- if and (eq .Values.backend.mode "combined") (not .Values.backend.combined.overrideConfig) }}
{{- $values := .Values.backend.combined -}}
{{- $name := printf "%s-credentials" (include "netbird.componentName" (dict "root" . "component" "combined")) -}}
{{- $stores := $values.config.store -}}
{{- $defaultStore := deepCopy $stores.default -}}
{{- $netbirdStore := mergeOverwrite (deepCopy $defaultStore) (deepCopy (default dict $stores.netbird)) -}}
{{- $authStore := mergeOverwrite (deepCopy $defaultStore) (deepCopy (default dict $stores.auth)) -}}
{{- $activityStore := mergeOverwrite (deepCopy $defaultStore) (deepCopy (default dict $stores.activity)) -}}
{{- $owner := $values.config.auth.owner -}}
{{- if or $owner.email $owner.password -}}
{{- if not (and $owner.email $owner.password) -}}
{{- fail "backend.combined.config.auth.owner.email and password must be set together" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "combined") | nindent 4 }}
type: Opaque
stringData:
  relay-auth-secret: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "relay-auth-secret" "value" $values.config.auth.secret "length" 32) | quote }}
  datastore-encryption-key: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "datastore-encryption-key" "value" $netbirdStore.encryptionKey "length" 32 "base64" true) | quote }}
  idp-session-cookie-encryption-key: {{ include "netbird.persistedSecret" (dict "root" . "name" $name "key" "idp-session-cookie-encryption-key" "value" $values.config.auth.sessionCookieEncryptionKey "length" 32) | quote }}
  {{- with $netbirdStore.dsn }}
  netbird-store-dsn: {{ . | quote }}
  {{- end }}
  {{- with $authStore.dsn }}
  auth-store-dsn: {{ . | quote }}
  {{- end }}
  {{- with $activityStore.dsn }}
  activity-store-dsn: {{ . | quote }}
  {{- end }}
  {{- with $values.config.relays.secret }}
  external-relay-secret: {{ . | quote }}
  {{- end }}
  {{- if and $owner.email $owner.password }}
  owner-email: {{ $owner.email | quote }}
  owner-password-checksum: {{ sha256sum $owner.password | quote }}
  owner-password-hash: {{ include "netbird.passwordHash" (dict "root" . "name" $name "hashKey" "owner-password-hash" "checksumKey" "owner-password-checksum" "password" $owner.password) | quote }}
  {{- end }}
{{- end }}
