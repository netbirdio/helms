{{- if eq .Values.backend.mode "combined" }}
{{- $values := .Values.backend.combined -}}
{{- $name := include "netbird.componentName" (dict "root" . "component" "combined") -}}
{{- $credentialsName := printf "%s-credentials" $name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "combined") | nindent 4 }}
  {{- with $values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" (dict "root" . "component" "combined") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/combined/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ dict "auth" $values.config.auth "stores" $values.config.store "relays" $values.config.relays | toJson | sha256sum }}
        {{- with $values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netbird.selectorLabels" (dict "root" . "component" "combined") | nindent 8 }}
    spec:
      {{- with $values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "netbird.serviceAccountName" (dict "root" . "component" "combined" "values" $values) }}
      securityContext:
        {{- toYaml $values.pod.securityContext | nindent 8 }}
      containers:
        - name: combined
          image: "{{ $values.image.repository }}:{{ $values.image.tag }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          {{- with $values.container.cmd.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config
            - /etc/netbird/config.yaml
            {{- with $values.container.cmd.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $values.container.securityContext | nindent 12 }}
          env:
            {{- if not $values.overrideConfig }}
            - name: NB_SERVER_AUTHSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: relay-auth-secret
            - name: NB_SERVER_STORE_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: datastore-encryption-key
            - name: NB_SERVER_AUTH_SESSIONCOOKIEENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: idp-session-cookie-encryption-key
            {{- with $values.config.store.netbird.dsn | default $values.config.store.default.dsn }}
            - name: NB_SERVER_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: netbird-store-dsn
            {{- end }}
            {{- with $values.config.store.auth.dsn | default $values.config.store.default.dsn }}
            - name: NB_SERVER_AUTHSTORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: auth-store-dsn
            {{- end }}
            {{- with $values.config.store.activity.dsn | default $values.config.store.default.dsn }}
            - name: NB_SERVER_ACTIVITYSTORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: activity-store-dsn
            {{- end }}
            {{- with $values.config.relays.secret }}
            - name: NB_SERVER_RELAYS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: external-relay-secret
            {{- end }}
            {{- if and $values.config.auth.owner.email $values.config.auth.owner.password }}
            - name: NB_SERVER_AUTH_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: owner-email
            - name: NB_SERVER_AUTH_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsName }}
                  key: owner-password-hash
            {{- end }}
            {{- end }}
            {{- include "netbird.env" (dict "values" $values) | nindent 12 }}
          {{- with $values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $values.container.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $values.config.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ $values.config.health.port }}
              protocol: TCP
            {{- range $values.config.stunPorts }}
            - name: stun-{{ . }}
              containerPort: {{ . }}
              protocol: UDP
            {{- end }}
          {{- with $values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/netbird/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if $values.persistence.enabled }}
            - name: data
              mountPath: {{ $values.persistence.mountPath }}
            {{- end }}
            {{- with $values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- if $values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name $values.persistence.existingClaim }}
        {{- end }}
        {{- with $values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
