{{- if and (eq .Values.backend.mode "combined") .Values.backend.combined.persistence.enabled (not .Values.backend.combined.persistence.existingClaim) }}
{{- $values := .Values.backend.combined -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "netbird.componentName" (dict "root" . "component" "combined") }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "combined") | nindent 4 }}
  {{- with $values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $values.persistence.size }}
  {{- with $values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
