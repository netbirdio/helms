{{- $values := .Values.dashboard -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.componentName" (dict "root" . "component" "dashboard") }}
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
  {{- with $values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $values.service.type }}
  ports:
    - name: http
      port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "netbird.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
  {{- with $values.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
