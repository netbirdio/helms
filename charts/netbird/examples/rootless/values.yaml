# Runs every component under the restricted Pod Security Standard.
# Layer this file over your own values:
#   helm upgrade --install netbird ./charts/netbird -f my-values.yaml -f ./charts/netbird/examples/rootless/values.yaml
dashboard:
  rootless: true
  image:
    # The rootless variant runs as 10001:0 and listens on 8080.
    tag: v2.96.0-rootless

backend:
  split:
    management:
      rootless: true
    signal:
      rootless: true
    relay:
      rootless: true
