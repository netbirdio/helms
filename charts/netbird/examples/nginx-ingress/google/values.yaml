fullnameOverride: netbird

dashboard:
  config:
    api:
      httpEndpoint: https://netbird.example.com:443
      grpcEndpoint: https://netbird.example.com:443
    auth:
      authority: https://accounts.google.com
      useAuth0: false
      supportedScopes: openid profile email
      redirectUri: /auth
      silentRedirectUri: /silent-auth
      tokenSource: idToken
  envFromSecret:
    AUTH_AUDIENCE: netbird/idpClientID
    AUTH_CLIENT_ID: netbird/idpClientID
    AUTH_CLIENT_SECRET: netbird/idpClientSecret
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: netbird-dashboard.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-dashboard-tls
        hosts:
          - netbird-dashboard.example.com

backend:
  split:
    management:
      container:
        cmd:
          args:
            - --disable-anonymous-metrics=false
            - --dns-domain=netbird.selfhosted
      envFromSecret:
        STUN_SERVER: netbird/stunServer
        TURN_SERVER: netbird/turnServer
        TURN_SERVER_USER: netbird/turnServerUser
        TURN_SERVER_PASSWORD: netbird/turnServerPassword
        IDP_CLIENT_ID: netbird/idpClientID
        IDP_CLIENT_SECRET: netbird/idpClientSecret
        SERVICE_ACCOUNT_KEY: netbird-gcp-service-account/sa.json
        CUSTOMER_ID: netbird/customerID
      config:
        stuns:
          - proto: udp
            uri: "{{ .STUN_SERVER }}"
            username: ""
            password: null
        turnConfig:
          turns:
            - proto: udp
              uri: "{{ .TURN_SERVER }}"
              username: "{{ .TURN_SERVER_USER }}"
              password: "{{ .TURN_SERVER_PASSWORD }}"
          credentialsTTL: 12h
          secret: secret
          timeBasedCredentials: false
        reverseProxy:
          trustedPeers:
            # Replace with your Kubernetes cluster's pod CIDR.
            - 10.244.0.0/16
        embeddedIdp:
          enabled: false
        httpConfig:
          address: 0.0.0.0:33073
          authIssuer: https://accounts.google.com
          authAudience: "{{ .IDP_CLIENT_ID }}"
          authKeysLocation: https://www.googleapis.com/oauth2/v3/certs
          authUserIDClaim: ""
          certFile: ""
          certKey: ""
          idpSignKeyRefreshEnabled: true
          oidcConfigEndpoint: https://accounts.google.com/.well-known/openid-configuration
        idpManagerConfig:
          managerType: google
          clientConfig:
            issuer: https://accounts.google.com
            tokenEndpoint: https://oauth2.googleapis.com/token
            clientID: ""
            clientSecret: ""
            grantType: client_credentials
          extraConfig:
            CustomerId: "{{ .CUSTOMER_ID }}"
            ServiceAccountKey: "{{ .SERVICE_ACCOUNT_KEY }}"
        deviceAuthorizationFlow:
          provider: hosted
          providerConfig:
            audience: "{{ .IDP_CLIENT_ID }}"
            authorizationEndpoint: ""
            domain: ""
            clientID: ""
            clientSecret: ""
            tokenEndpoint: https://oauth2.googleapis.com/token
            deviceAuthEndpoint: https://oauth2.googleapis.com/device/code
            scope: openid
            useIDToken: true
            redirectURLs: null
        pkceAuthorizationFlow:
          providerConfig:
            audience: "{{ .IDP_CLIENT_ID }}"
            clientID: "{{ .IDP_CLIENT_ID }}"
            clientSecret: "{{ .IDP_CLIENT_SECRET }}"
            domain: ""
            authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
            tokenEndpoint: https://oauth2.googleapis.com/token
            scope: openid profile email
            redirectURLs:
              - http://localhost:53000
            useIDToken: true
      ingress:
        http:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: netbird.example.com
              paths:
                - path: /api
                  pathType: ImplementationSpecific
          tls:
            - secretName: netbird-api-tls
              hosts:
                - netbird.example.com
        grpc:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/backend-protocol: GRPC
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          hosts:
            - host: netbird.example.com
              paths:
                - path: /management.ManagementService
                  pathType: ImplementationSpecific
          tls:
            - secretName: netbird-grpc-tls
              hosts:
                - netbird.example.com
      persistence:
        enabled: true
      log:
        file: console
        level: error

    signal:
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/backend-protocol: GRPC
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: netbird.example.com
            paths:
              - path: /signalexchange.SignalExchange
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-signal-tls
            hosts:
              - netbird.example.com

    relay:
      resources:
        requests:
          cpu: 300m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 256Mi
      config:
        exposedAddress: rels://netbird.example.com:443/relay
        log:
          level: info
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: netbird.example.com
            paths:
              - path: /relay
                pathType: ImplementationSpecific
        tls:
          - secretName: netbird-relay-tls
            hosts:
              - netbird.example.com
