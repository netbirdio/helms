{{- if gt (int (index $.Values.netbird.backend.split $component).replicaCount) 1 }}
{{- fail (printf "netbird.backend.split.%s.replicaCount must be 1: netbird-ee runs single instance" $component) }}
{{- end }}
{{- end }}
