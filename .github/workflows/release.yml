name: Release Helm Chart

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

# serialize gh-pages index updates
concurrency: gh-pages

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          # tag is <chart>-v<semver>, e.g. netbird-v2.0.1 or netbird-ee-v0.1.0-rc.1.
          # SemVer build metadata (+build.1) is rejected: OCI tags can't hold "+", so helm push
          # would publish it as "_" and the ghcr tag would differ from the release and index.yaml.
          # A malformed pre-release slips past this check but fails helm package below.
          if ! [[ "$TAG" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] || [ ! -f "charts/${BASH_REMATCH[1]}/Chart.yaml" ]; then
            echo "Tag $TAG is not <chart>-v<semver> for a chart in charts/, e.g. netbird-v2.0.0 or netbird-ee-v0.1.0 (build metadata like +build.1 is not supported)"
            exit 1
          fi
          CHART="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          echo "CHART=$CHART" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          helm dependency build "charts/$CHART"
          helm package "charts/$CHART" --version "$VERSION" --destination dist

      - name: Upload chart to release
        run: gh release upload "$TAG" "dist/$CHART-$VERSION.tgz" --clobber

      - name: Push chart to OCI registry
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/$CHART-$VERSION.tgz" oci://ghcr.io/${{ github.repository_owner }}/helm-charts

      - name: Update Helm repository index
        run: |
          helm repo index dist \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            --merge gh-pages/index.yaml
          cp dist/index.yaml gh-pages/index.yaml
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "Release $CHART $VERSION"
          git push
