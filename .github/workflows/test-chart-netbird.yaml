name: Test netbird Chart

on:
  push:
  pull_request:

jobs:
  render:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --fail --location --silent --show-error \
            --output "$installer" \
            https://raw.githubusercontent.com/helm/helm/e4da49785aa6e6ee2b86efd5dd9e43400318262b/scripts/get-helm-3
          printf '%s  %s\n' \
            '4a01413bf2a767ae744b8bbe4485cd83654d9a0a769c92377afc36328d5a007a' \
            "$installer" | sha256sum --check -
          DESIRED_VERSION=v3.17.3 bash "$installer"

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm chart
        run: helm lint --strict ./charts/netbird --values charts/netbird/tests/values/secret-refs.yaml

      - name: Run render checks
        run: charts/netbird/tests/render.sh

      - name: Render external Secret references
        run: helm template test-chart ./charts/netbird --namespace netbird --values charts/netbird/tests/values/secret-refs.yaml >/dev/null

      - name: Lint and render netbird-ee
        run: charts/netbird-ee/tests/render.sh
