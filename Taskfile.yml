version: "3"

vars:
  CHART_DIR: charts/netbird
  DEV_VALUES: charts/netbird/examples/kind/values.yaml
  KIND_CONFIG: charts/netbird/examples/kind/kind.yaml
  INGRESS_NGINX_VERSION: 1.12.1
  LOCAL_HOST: netbird.localhost
  DASHBOARD_HOST: dashboard.netbird.localhost
  CLUSTER_NAME: '{{default "netbird-chart-dev" .CLUSTER_NAME}}'
  LOCAL_CERT_DIR: /tmp/{{.CLUSTER_NAME}}
  KUBE_CONTEXT: kind-{{.CLUSTER_NAME}}
  NAMESPACE: '{{default "netbird" .NAMESPACE}}'
  RELEASE_NAME: '{{default "netbird" .RELEASE_NAME}}'
  HELM_TIMEOUT: '{{default "5m" .HELM_TIMEOUT}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  chart:lint:
    desc: Lint the NetBird chart
    preconditions:
      - sh: command -v helm
        msg: helm is required
    cmds:
      - helm lint {{.CHART_DIR}}

  chart:template:
    desc: Render the NetBird chart locally
    preconditions:
      - sh: command -v helm
        msg: helm is required
    cmds:
      - helm template {{.RELEASE_NAME}} {{.CHART_DIR}} --namespace {{.NAMESPACE}} {{.CLI_ARGS}}

  cluster:create:
    desc: Create the dedicated kind cluster
    preconditions:
      - sh: command -v kind
        msg: kind is required
    status:
      - kind get kubeconfig --name {{.CLUSTER_NAME}}
    cmds:
      - kind create cluster --name {{.CLUSTER_NAME}} --config {{.KIND_CONFIG}} --wait 2m

  cluster:delete:
    desc: Delete the dedicated kind cluster
    preconditions:
      - sh: command -v kind
        msg: kind is required
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}


  ingress:install:
    desc: Install ingress-nginx in the kind cluster
    preconditions:
      - sh: command -v kubectl
        msg: kubectl is required
      - sh: kind get kubeconfig --name {{.CLUSTER_NAME}}
        msg: Run "task cluster:create" first
    cmds:
      - >-
        kubectl --context {{.KUBE_CONTEXT}} apply
        --filename https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v{{.INGRESS_NGINX_VERSION}}/deploy/static/provider/kind/deploy.yaml
      - >-
        kubectl --context {{.KUBE_CONTEXT}}
        --namespace ingress-nginx
        wait deployment/ingress-nginx-controller
        --for condition=Available
        --timeout 2m

  local:certificate:
    internal: true
    preconditions:
      - sh: command -v openssl
        msg: openssl is required
    status:
      - test -s {{.LOCAL_CERT_DIR}}/tls.crt && test -s {{.LOCAL_CERT_DIR}}/tls.key
    cmds:
      - mkdir -p {{.LOCAL_CERT_DIR}}
      - >-
        openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 3650
        -keyout {{.LOCAL_CERT_DIR}}/tls.key
        -out {{.LOCAL_CERT_DIR}}/tls.crt
        -subj /CN={{.LOCAL_HOST}}
        -addext subjectAltName=DNS:{{.LOCAL_HOST}},DNS:{{.DASHBOARD_HOST}}

  dev:tls:
    desc: Create the self-signed certificate used by local ingresses
    preconditions:
      - sh: command -v kubectl
        msg: kubectl is required
      - sh: kind get kubeconfig --name {{.CLUSTER_NAME}}
        msg: Run "task cluster:create" first
    cmds:
      - task: local:certificate
      - >-
        kubectl --context {{.KUBE_CONTEXT}} create namespace {{.NAMESPACE}}
        --dry-run=client
        --output yaml
        | kubectl --context {{.KUBE_CONTEXT}} apply --filename -
      - >-
        kubectl --context {{.KUBE_CONTEXT}}
        --namespace {{.NAMESPACE}}
        create secret tls netbird-local-tls
        --cert {{.LOCAL_CERT_DIR}}/tls.crt
        --key {{.LOCAL_CERT_DIR}}/tls.key
        --dry-run=client
        --output yaml
        | kubectl --context {{.KUBE_CONTEXT}} apply --filename -

  dev:deploy:
    desc: Install or upgrade the chart in the kind cluster
    preconditions:
      - sh: command -v helm
        msg: helm is required
      - sh: command -v kind
        msg: kind is required
      - sh: kind get kubeconfig --name {{.CLUSTER_NAME}}
        msg: Run "task cluster:create" first
    cmds:
      - >-
        helm upgrade --install {{.RELEASE_NAME}} {{.CHART_DIR}}
        --kube-context {{.KUBE_CONTEXT}}
        --namespace {{.NAMESPACE}}
        --create-namespace
        --values {{.DEV_VALUES}}
        --wait
        --timeout {{.HELM_TIMEOUT}}
        {{.CLI_ARGS}}

  dev:up:
    desc: Create the local kind platform with HTTPS ingress
    cmds:
      - task: cluster:create
      - task: ingress:install
      - task: dev:tls
      - task: dev:deploy
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'

  dev:status:
    desc: Show the development release and workloads
    preconditions:
      - sh: command -v helm
        msg: helm is required
      - sh: command -v kind
        msg: kind is required
      - sh: command -v kubectl
        msg: kubectl is required
      - sh: kind get kubeconfig --name {{.CLUSTER_NAME}}
        msg: Run "task dev:up" first
    cmds:
      - helm status {{.RELEASE_NAME}} --kube-context {{.KUBE_CONTEXT}} --namespace {{.NAMESPACE}}
      - kubectl --context {{.KUBE_CONTEXT}} --namespace {{.NAMESPACE}} get pods,services,persistentvolumeclaims,ingresses
      - task: dev:urls

  dev:urls:
    desc: Print the local platform URLs
    silent: true
    cmds:
      - echo "Dashboard  https://{{.DASHBOARD_HOST}}"
      - echo "API        https://{{.LOCAL_HOST}}/api"

  dev:down:
    desc: Delete the development kind cluster
    cmds:
      - task: cluster:delete
